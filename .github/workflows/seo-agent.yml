name: SEO agent

# Weekly: the MiniMax-powered agent audits and improves site/, and opens a pull request for review.
# Nothing is published until that pull request is merged into main.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC (09:17 in Dubai)
  workflow_dispatch:
    inputs:
      instructions:
        description: Optional extra focus for this run (e.g. "improve Arabic name searches")
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: seo-agent
  cancel-in-progress: false

jobs:
  seo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      BASE_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the agent reads recent site/ history to avoid undoing earlier changes

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Skip if an SEO pull request is still open
        id: open
        shell: bash
        run: |
          count=$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("seo-agent/"))] | length')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != "0" ]; then
            echo "An SEO agent pull request is still open. Review or close it before the next run." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run SEO agent
        if: steps.open.outputs.count == '0'
        env:
          MINIMAX_API_KEY: ${{ secrets.MINIMAX_API_KEY }}
          MINIMAX_BASE_URL: ${{ vars.MINIMAX_BASE_URL }}
          SEO_AGENT_MODEL: ${{ vars.SEO_AGENT_MODEL }}
          SEO_AGENT_INSTRUCTIONS: ${{ inputs.instructions }}
        run: python -m seo_agent

      - name: Gate - build and audit the proposed site
        if: steps.open.outputs.count == '0'
        run: python -m site_tools.build && python -m site_tools.audit --fail-on error

      - name: Open pull request
        if: steps.open.outputs.count == '0'
        shell: bash
        run: |
          cat seo-report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -z "$(git status --porcelain -- site/)" ]; then
            echo "No site changes proposed this week."
            exit 0
          fi
          branch="seo-agent/$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add site/
          git commit -F seo-title.txt
          git push origin "$branch"
          gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$(cat seo-title.txt)" --body-file seo-report.md
