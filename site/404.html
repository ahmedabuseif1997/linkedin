<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07110f">
  <title>Page not found — Ahmed Abouseif</title>
  <link rel="icon" href="{{SITE_URL}}favicon.svg" type="image/svg+xml">
  <style>
    :root { --ink:#07110f; --mint:#7cf5c6; --cream:#f1eee7; --muted:#9eaaa6; --line:rgba(241,238,231,.14); }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:1.5rem; background:var(--ink); color:var(--cream); font-family:"DM Sans",system-ui,sans-serif; text-align:center }
    .code { color:var(--mint); font-size:.78rem; font-weight:600; letter-spacing:.16em; text-transform:uppercase }
    h1 { font-family:Manrope,system-ui,sans-serif; font-size:clamp(2.2rem,7vw,4.5rem); letter-spacing:-.05em; line-height:1; margin:.8rem 0 1rem }
    p { color:var(--muted); margin:0 0 2rem }
    a { display:inline-flex; min-height:48px; align-items:center; padding:.7rem 1.1rem; background:var(--mint); color:var(--ink); font-weight:600; text-decoration:none }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Page not found.</h1>
    <p>The page you requested does not exist. · <span lang="ar" dir="rtl">الصفحة المطلوبة غير موجودة.</span></p>
    <a href="{{SITE_URL}}">Go to the homepage</a>
  </main>
</body>
</html>
